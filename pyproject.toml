[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telearchimedesbot"
version = "0.1.11"
description = "Telegram group bot that rewards help with stars and tracks open questions."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv==1.2.2",
]

[project.scripts]
telearchimedesbot = "telearchimedes_bot.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["telearchimedes_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
